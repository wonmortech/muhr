version = 1
SPDX-PackageName = "muhr"
SPDX-PackageSupplier = "Wonmor <https://github.com/wonmortech>"
SPDX-PackageDownloadLocation = "https://github.com/wonmortech/muhr"

# Files that cannot carry a comment, or where one would be shown to readers: documents, data, images.
# Every source file (JS, CSS, HTML, YAML, shell, Caddyfile) has its own SPDX header; `reuse lint` runs in CI.
[[annotations]]
path = [
  "**/*.md",
  "package.json",
  "package-lock.json",
  "REUSE.toml",
  "site/og-*.png",
  "site/robots.txt",
  "site/sitemap.xml",
  "site/.well-known/security.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Wonmor and Muhr contributors"
SPDX-License-Identifier = "Apache-2.0"

# Self-hosted fonts (subsets as served by Google Fonts), SIL Open Font License 1.1.
# Families per DESIGN.md: sans = Hanken Grotesk (Latin) + Onest (Cyrillic), serif = Source Serif 4, mono = JetBrains Mono.
[[annotations]]
path = ["site/fonts/sans-latin.woff2", "site/fonts/sans-latin-ext.woff2", "site/fonts/LICENSE-hanken-grotesk.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021 The Hanken Grotesk Project Authors <https://github.com/marcologous/hanken-grotesk>"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/fonts/sans-cyrillic.woff2", "site/fonts/sans-cyrillic-ext.woff2", "site/fonts/LICENSE-onest.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021 The Onest Project Authors <https://github.com/simpals/onest>"
SPDX-License-Identifier = "OFL-1.1"

# The Google Fonts licence file names "Google Inc."; the font itself is Adobe's (Reserved Font Name "Source").
[[annotations]]
path = ["site/fonts/serif-*.woff2", "site/fonts/LICENSE-source-serif-4.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2014-2023 Adobe <http://www.adobe.com/>, with Reserved Font Name 'Source'", "Google Inc."]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/fonts/mono-*.woff2", "site/fonts/LICENSE-jetbrains-mono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors <https://github.com/JetBrains/JetBrainsMono>"
SPDX-License-Identifier = "OFL-1.1"
